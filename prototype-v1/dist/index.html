<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101217"><title>Ember — твій ритм</title><link rel="stylesheet" href="style.css"></head><body><canvas id="atmosphere" aria-hidden="true"></canvas><div class="ambient-shade"></div><main><header><div><div class="brand">EMBER <span>/ 05</span></div><h1 id="greeting">Привіт, як ти?</h1></div><button class="avatar" id="avatar" data-panel="Профіль" aria-label="Відкрити профіль">Я</button></header><div class="dashboard"><section class="overview"><button class="sleep-strip glass" data-panel="Сон"><span class="icon-bubble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15A9 9 0 0 1 9 3a9 9 0 1 0 11 12Z"/></svg></span><span class="strip-label">Твій сон<strong><span id="sleepValue">…</span> <small id="sleepQuality"></small></strong></span><span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button><div class="nutrition-orbit"><div class="orbit-label">Харчування сьогодні</div><button class="orbit" id="nutrition" aria-label="Відкрити підсумок харчування"><svg class="ring" viewBox="0 0 240 240" aria-hidden="true"><defs><linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#82d7cb"/><stop offset=".55" stop-color="#b4a1e5"/><stop offset="1" stop-color="#e9b79c"/></linearGradient></defs><circle class="track" cx="120" cy="120" r="102"/><circle id="ringProgress" class="arc" cx="120" cy="120" r="102"/></svg><span class="orbit-core"><span class="orbit-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M5 19 19 5"/></svg></span><strong id="cal">—</strong><span class="orbit-unit" id="calNorm">завантаження…</span><span class="orbit-left" id="remaining"></span></span></button><div class="macros"><div><span class="macro-dot protein"></span>Білки<strong id="protein">— <small>г</small></strong></div><div><span class="macro-dot fat"></span>Жири<strong id="fat">— <small>г</small></strong></div><div><span class="macro-dot carbs"></span>Вуглеводи<strong id="carbs">— <small>г</small></strong></div></div></div><button id="add" class="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg> <span>Додати їжу</span><small>Зі знайомого</small></button></section><section class="details"><div class="mini-grid"><button class="metric glass" data-panel="Активність"><span class="metric-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 19 3-6-4-3 3-5 4 4h4M4 14h5M12 13l5 7M15 2h.01"/></svg> Рух <span class="tiny-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></span><strong id="burned">—</strong><span class="muted" id="burnedLabel">спалено сьогодні</span><div class="bars" id="weekBars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></button><button class="metric glass" id="workout"><span class="metric-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8v8M6 5v14M18 5v14M21 8v8M6 12h12"/></svg> Тренування <span class="tiny-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></span><strong id="workoutValue">—</strong><span class="muted" id="workoutName">…</span><span class="workout-pill" id="workoutPill">Коли будеш готовий</span></button></div><button class="companion glass" id="insight"><span class="icon-bubble warm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M5 19 19 5"/></svg></span><span><strong id="companionTitle">У твоєму темпі.</strong><small id="companionText">Погляньмо, як проходить день</small></span><span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button><form class="composer glass" id="chat"><input id="message" aria-label="Повідомлення помічнику" placeholder="Як ти? Можеш просто розповісти…" maxlength="500" required><button aria-label="Надіслати повідомлення"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v15"/></svg></button></form><footer><span id="syncStatus">Завантаження…</span><button id="motion" aria-pressed="false">Зупинити фон</button></footer></section></div></main><nav class="bottom-nav glass" aria-label="Основна навігація"><button class="selected" aria-current="page" id="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Мій день</span></button><button data-panel="Прогрес"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M12 20V4M19 20V8"/></svg><span>Прогрес</span></button><button data-panel="Більше"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg><span>Більше</span></button></nav><dialog id="dialog"><button id="close" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="api.js"></script><script src="app.js"></script><script src="scenes.js"></script></body></html>
